name: Update Pinned Repos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate Featured Projects from pinned repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          gh api graphql -F login="$GH_USER" -f query='
            query($login: String!) {
              user(login: $login) {
                pinnedItems(first: 6, types: REPOSITORY) {
                  nodes {
                    ... on Repository {
                      name
                      description
                      url
                      stargazerCount
                      primaryLanguage { name }
                    }
                  }
                }
              }
            }' > /tmp/pinned.json

          python3 << 'PYEOF'
          import json, re

          with open('/tmp/pinned.json') as f:
              repos = json.load(f)['data']['user']['pinnedItems']['nodes']

          def card(r):
              lang = (r.get('primaryLanguage') or {}).get('name')
              meta = ' · '.join(x for x in [f"⭐ {r['stargazerCount']}", lang] if x)
              desc = r.get('description') or ''
              return (
                  '<td width="50%">\n\n'
                  f'<h3 align="center"><a href="{r["url"]}">{r["name"]}</a></h3>\n'
                  f'<p align="center"><strong>{meta}</strong></p>\n'
                  f'<p align="center">{desc}</p>\n\n'
                  '</td>'
              )

          cards = [card(r) for r in repos]
          if len(cards) % 2:
              cards.append('<td width="50%"></td>')
          rows = ['<tr>\n' + '\n'.join(cards[i:i+2]) + '\n</tr>'
                  for i in range(0, len(cards), 2)]
          section = '<table>\n' + '\n'.join(rows) + '\n</table>'

          with open('README.md') as f:
              readme = f.read()
          readme = re.sub(
              r'<!-- PINNED-REPOS:START -->.*?<!-- PINNED-REPOS:END -->',
              f'<!-- PINNED-REPOS:START -->\n{section}\n<!-- PINNED-REPOS:END -->',
              readme, flags=re.DOTALL)
          with open('README.md', 'w') as f:
              f.write(readme)
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: sync featured projects from pinned repos [skip ci]"
            git push
          fi
