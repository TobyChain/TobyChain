name: Update Pinned Repos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate Featured Projects from pinned repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: |
          gh api graphql -F login="$GH_USER" -f query='
            query($login: String!) {
              user(login: $login) {
                pinnedItems(first: 6, types: REPOSITORY) {
                  nodes {
                    ... on Repository {
                      name
                      nameWithOwner
                      description
                      url
                      primaryLanguage { name color }
                      repositoryTopics(first: 4) { nodes { topic { name } } }
                    }
                  }
                }
              }
            }' > /tmp/pinned.json

          python3 << 'PYEOF'
          import json, re, html
          from urllib.parse import quote

          with open('/tmp/pinned.json') as f:
              repos = json.load(f)['data']['user']['pinnedItems']['nodes']

          def lang_badge(name, color):
              c = (color or 'grey').lstrip('#')
              return (f'<img src="https://img.shields.io/badge/{quote(name, safe="")}-{c}'
                      f'?style=flat-square" alt="{html.escape(name)}" />')

          def card(r):
              owner_repo = r['nameWithOwner']
              desc = html.escape(r.get('description') or '')
              lang = r.get('primaryLanguage') or {}
              topics = [t['topic']['name'] for t in (r.get('repositoryTopics') or {}).get('nodes', [])]

              stars = (f'<a href="{r["url"]}/stargazers">'
                       f'<img src="https://img.shields.io/github/stars/{owner_repo}?style=social" alt="stars" /></a>')
              badges = [stars]
              if lang.get('name'):
                  badges.append(lang_badge(lang['name'], lang.get('color')))

              lines = ['<td width="50%">', '']
              lines.append(f'<h3 align="center"><a href="{r["url"]}">{html.escape(r["name"])}</a></h3>')
              if desc:
                  lines.append(f'<p align="center">{desc}</p>')
              lines.append('<p align="center">')
              lines.append('\n'.join(f'  {b}' for b in badges))
              lines.append('</p>')
              if topics:
                  tb = ' '.join(
                      f'<img src="https://img.shields.io/badge/{quote("#" + t, safe="")}-informational'
                      f'?style=flat-square" alt="{html.escape(t)}" />' for t in topics)
                  lines.append(f'<p align="center">{tb}</p>')
              lines += ['', '</td>']
              return '\n'.join(lines)

          cards = [card(r) for r in repos]
          if len(cards) % 2:
              cards.append('<td width="50%"></td>')
          rows = ['<tr>\n' + '\n'.join(cards[i:i+2]) + '\n</tr>' for i in range(0, len(cards), 2)]
          section = '<table>\n' + '\n'.join(rows) + '\n</table>'

          with open('README.md') as f:
              readme = f.read()
          readme = re.sub(
              r'<!-- PINNED-REPOS:START -->.*?<!-- PINNED-REPOS:END -->',
              f'<!-- PINNED-REPOS:START -->\n{section}\n<!-- PINNED-REPOS:END -->',
              readme, flags=re.DOTALL)
          with open('README.md', 'w') as f:
              f.write(readme)
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: sync featured projects from pinned repos [skip ci]"
            git push
          fi
